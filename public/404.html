<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Protect the King</title>
    <style>
      html, body { height: 100%; margin: 0; }
      body {
        display: grid;
        place-items: center;
        background: radial-gradient(ellipse at 50% 42%, #17301f 0%, #08110c 68%), #08110c;
        color: #ebe6d6;
        font-family: "Pixelify Sans", "Courier New", monospace;
        text-align: center;
      }
      a { color: #e0a84a; }
    </style>
  </head>
  <body>
    <p>Returning to the kingdom… <a id="home" href="/">Open Protect the King</a></p>
    <script>
      // GitHub Pages serves this file for unknown paths. Project sites live
      // under /<repo>/, so send the visitor back to that app root.
      var parts = location.pathname.split('/').filter(Boolean);
      var base = location.hostname.endsWith('.github.io') && parts.length > 1
        ? '/' + parts[0] + '/'
        : '/';
      var home = document.getElementById('home');
      if (home) home.href = base;
      location.replace(base);
    </script>
  </body>
</html>
