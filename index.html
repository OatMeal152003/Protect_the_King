<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Protect the King</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Cinzel+Decorative:wght@700;900&family=Jersey+10&family=MedievalSharp&family=Pixelify+Sans:wght@400;500;600;700&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <canvas id="canvas"></canvas>
      <div class="loader" id="loader" role="status" aria-live="polite">
        <div class="loader-card">
          <svg class="loader-crown" viewBox="0 0 11 9" fill="#e0a84a" aria-hidden="true">
            <rect x="0" y="1" width="1" height="1"/><rect x="5" y="0" width="1" height="1"/><rect x="10" y="1" width="1" height="1"/>
            <rect x="0" y="2" width="2" height="1"/><rect x="4" y="1" width="3" height="1"/><rect x="9" y="2" width="2" height="1"/>
            <rect x="0" y="3" width="11" height="3"/><rect x="1" y="6" width="9" height="1"/><rect x="1" y="8" width="9" height="1"/>
          </svg>
          <h1 class="loader-title">Protect the King</h1>
          <p class="loader-sub" id="loader-label">Setting up the board…</p>

          <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="loader-bar">
            <div class="bar-fill" id="loader-fill"></div>
          </div>
          <div class="loader-row"><span id="loader-file">Preparing</span><b id="loader-pct">0%</b></div>

          <p class="loader-tip" id="loader-tip"></p>
        </div>
      </div>
      <div id="error" class="overlay hidden">
        <div class="loading-box">
          <div class="title">WEBGL NOT AVAILABLE</div>
          <p>Your browser does not support WebGL. Please use a modern browser.</p>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
